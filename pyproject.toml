[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blaeckpy"
version = "1.0.0.dev0"
description = "The Python counterpart of the blaeck Arduino library: signals, entities and commands over the blaeck protocol"
readme = "README.md"
authors = [
    { name = "Sebastian Strobl" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["blaeck", "loggbok", "logging", "home assistant", "serial", "tcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/sebaJoSt/blaeckpy"
"Bug Reports" = "https://github.com/sebaJoSt/blaeckpy/issues"
"Source" = "https://github.com/sebaJoSt/blaeckpy"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
blaeckpy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
